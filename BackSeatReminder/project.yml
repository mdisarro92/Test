name: BackSeatReminder

options:
  bundleIdPrefix: com.mdisarro92
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  BackSeatReminder:
    type: application
    platform: iOS
    sources:
      - path: BackSeatReminder
        excludes:
          - PrivacyInfo.xcprivacy
    resources:
      - path: BackSeatReminder/PrivacyInfo.xcprivacy
    info:
      path: BackSeatReminder/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdisarro92.BackSeatReminder
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
